services:
  tcp_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectly-tcp-server
    entrypoint: ["python3", "/app/tcp_server/server.py"]
    environment:
      TCP_HOST: "0.0.0.0"
      TCP_PORT: "9000"
      DB_PATH: "/app/data/connectly.db"
    volumes:
      - connectly_data:/app/data
      - connectly_uploads:/app/uploads
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - connectly_net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectly-gateway
    entrypoint: ["uvicorn", "main:app", "--app-dir", "/app/backend", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TCP_HOST: "tcp_server"
      TCP_PORT: "9000"
      DB_PATH: "/app/data/connectly.db"
      APP_URL: "${APP_URL:-https://chat.example.com}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
    volumes:
      - connectly_data:/app/data
      - connectly_uploads:/app/uploads
    depends_on:
      - tcp_server
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - connectly_net

  nginx:
    image: nginx:1.27-alpine
    container_name: connectly-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - connectly_net

volumes:
  connectly_data:
  connectly_uploads:

networks:
  connectly_net:
    driver: bridge
